[project]
name = "rag-wiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.91.0",
    "fastembed>=0.8.0",
    "gitpython>=3.1.50",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.1",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.1.9",
    "pydantic>=2.13.3",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.1",
    "ruamel-yaml>=0.19.1",
]

[tool.setuptools.packages.find]
include = ["agent*", "core*", "ingestion*", "output*", "retrieval*"]
exclude = ["wiki*", "plan*", "tests*", "_raw*", "_staged*"]
