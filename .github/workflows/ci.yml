name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  security-and-smoke-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest bandit

    - name: Run Standard Tests
      env:
        QDRANT_MODE: memory
        PYTHONPATH: .
      run: |
        # PYTHONPATH is set via env to ensure local modules are found
        pytest tests/ -k "not test_security"

    - name: Run Security Tests (Dynamic Analysis)
      env:
        QDRANT_MODE: memory
        PYTHONPATH: .
      run: |
        # Run specific security tests (Path Traversal, Prompt Injection, etc.)
        pytest tests/test_security_*.py -v

    - name: Run Bandit (Static Application Security Testing)
      run: |
        # Run bandit on core source code to find common security issues
        # -ll ignores low severity issues, -ii ignores low confidence issues
        bandit -r agent/ core/ ingestion/ output/ retrieval/ -ll -ii

    - name: Run Dynamic Security Tests
      run: |
        # Run specific security tests (Path Traversal, Prompt Injection, etc.)
        PYTHONPATH=. pytest tests/test_security_*.py -v

    - name: Run Smoke Tests (Critical Logic Only)
      run: |
        # Run only core utility tests to verify basic functionality quickly
        PYTHONPATH=. pytest tests/test_utils.py tests/test_metadata_logic.py -v

  # Future deployment or build steps can be added here.
